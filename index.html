<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Port Calculator</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 1.25rem; max-width: 700px; margin: auto; }
    label { display:block; margin-bottom: .25rem; font-weight:600; }
    input[type="text"] { width: 100%; padding: .5rem; font-size: 1rem; box-sizing: border-box; }
    .row { margin: 1rem 0; }
    #result { font-size: 1.25rem; font-weight: 700; margin-top: .5rem; }
    .hint { color: #666; font-size: .9rem; margin-top:.25rem; }
  </style>
</head>
<body>
  <h1>Port calculator</h1>

  <div class="row">
    <label for="wordInput">Word (also read from URL hash)</label>
    <input id="wordInput" type="text" placeholder="Type a word (or use #word in the URL)"/>
    <div class="hint">The URL hash is kept in sync (no page reload). Example: https://.../#example</div>
  </div>

  <div class="row">
    <label>Calculated port(s)</label>
    <div id="result">—</div>
  </div>

  <script src="javascript_calculation.js"></script>
</body>
</html>
